<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Brand2Creator{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="nav">
  <a class="logo" href="{{ url_for('home') }}">Brand<span>2Creator</span></a>
  <nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('creators') }}">Creators</a>
    <a class="btn small" href="{{ url_for('campaign') }}">Find a Creator</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>Brand2Creator MVP · Small brands, real creators.</footer>
</body>
</html>
