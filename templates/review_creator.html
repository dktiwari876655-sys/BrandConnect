{% extends "base.html" %}
<style>
    .review-page {
        max-width: 600px;
        margin: 50px auto;
    }

    .review-card {
        padding: 28px;
        border-radius: 16px;
    }

    .review-title {
        margin-top: 0;
        margin-bottom: 22px;
        font-size: 28px;
        color: #111827;
    }
    .review-info {
    background: #f9fafb;
    padding: 15px 18px;
    border-radius: 10px;
    margin-bottom: 22px;
}
.rating-select {
    cursor: pointer;
    transition: 0.2s ease;
}
.review-textarea {
    transition: 0.2s ease;
}

.review-textarea:focus {
    border-color: #7c3aed !important;
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    outline: none;
}

.rating-select:focus {
    border-color: #7c3aed !important;
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    outline: none;
}
.review-submit {
    transition: 0.2s ease;
}

.review-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(124, 58, 237, 0.25);
}
.review-back {
    font-weight: 600;
    transition: 0.2s ease;
}

.review-back:hover {
    text-decoration: underline !important;
}

.review-info p {
    margin: 7px 0;
    color: #4b5563;
}

.review-info strong {
    color: #111827;
}
</style>

{% block title %}Review Creator — BrandConnect{% endblock %}

{% block content %}

<div class="review-page">
    <div class="card review-card">

        <h1 class="review-title">⭐ Review Creator</h1>

        <div class="review-info">
    <p>
        <strong>Creator:</strong>
        {{ deal["creator_name"] }}
    </p>

    <p>
        <strong>Campaign:</strong>
        {{ deal["brand_name"] }}
    </p>
</div>

        <hr>

        <form method="POST">

            <label>
                <strong>⭐ Your Rating</strong>
            </label>

            <select
                name="rating"
                required
                class="rating-select"
                style="
                    width:100%;
                    padding:12px;
                    margin-top:8px;
                    margin-bottom:20px;
                    border:1px solid #d1d5db;
                    border-radius:7px;
                    font-size:16px;
                "
            >
                <option value="">Select Rating</option>
                <option value="5">⭐⭐⭐⭐⭐ — Excellent</option>
                <option value="4">⭐⭐⭐⭐ — Very Good</option>
                <option value="3">⭐⭐⭐ — Good</option>
                <option value="2">⭐⭐ — Average</option>
                <option value="1">⭐ — Poor</option>
            </select>

            <label>
                <strong>📝 Your Review</strong>
            </label>

            <textarea
                name="review"
                class="review-textarea"
                rows="5"
                placeholder="Write your experience with this creator..."
                style="
                    width:100%;
                    box-sizing:border-box;
                    padding:12px;
                    margin-top:8px;
                    border:1px solid #d1d5db;
                    border-radius:7px;
                    font-size:15px;
                    resize:vertical;
                "
            ></textarea>

            <button
                type="submit"
                class="review-submit"
                style="
                    margin-top:20px;
                    background:#7c3aed;
                    color:white;
                    border:none;
                    padding:12px 22px;
                    border-radius:7px;
                    cursor:pointer;
                    font-weight:bold;
                "
            >
                ⭐ Submit Review
            </button>

        </form>

        <a
            href="{{ url_for('brand_dashboard') }}"
            class="review-back"
            style="
                display:inline-block;
                margin-top:15px;
                color:#2563eb;
                text-decoration:none;
            "
        >
            ← Back to Dashboard
        </a>

    </div>

</div>

{% endblock %}
